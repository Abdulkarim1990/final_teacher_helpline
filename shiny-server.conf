run_as shiny;

server {
  listen 3838;

  location / {
    app_dir /srv/shiny-server/app;
    log_dir /var/log/shiny-server;
    directory_index off;

    # Keep idle app processes alive indefinitely (0 = no timeout).
    # The app's own session-timeout observer handles user-level logout.
    app_idle_timeout 0;

    # Allow up to 60 seconds for the app to start before giving up
    app_init_timeout 60;

    # SockJS heartbeat every 10 seconds (default 25 s is too slow for
    # some proxies / load balancers that close idle connections at ~30 s)
    sockjs_heartbeat_delay 10000;

    # Wait up to 20 seconds for a missing heartbeat before declaring the
    # connection dead (default 10 s can be too aggressive on slow networks)
    sockjs_disconnect_delay 20000;

    # Keep the R process alive even when no one is connected, so
    # reconnects find the same session
    reconnect true;
  }
}
